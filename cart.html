<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./assets/images/Bookshelf.png">
    <link rel="stylesheet" href="./assets/css/cart.css">
    <title>Giỏ hàng | Bookshelf</title>
</head>
<body class="cart-page">
    <main class="cart">
        <nav class="cart__navigation" aria-label="Điều hướng giỏ hàng">
            <a class="cart__logo" href="./index.html">Bookshelf</a>
            <a href="./productlist.html">Danh sách sản phẩm</a>
        </nav>
        <header class="cart__heading">
            <h1>Giỏ hàng</h1>
            <p id="cart-count" aria-live="polite">0 sản phẩm</p>
        </header>

        <div id="cart-content">
            <div class="cart__table-wrapper">
                <table class="cart__table" aria-label="Sản phẩm trong giỏ hàng">
                    <thead>
                        <tr>
                            <th scope="col">Sản phẩm</th>
                            <th scope="col">Đơn giá</th>
                            <th scope="col">Số lượng</th>
                            <th scope="col">Thành tiền</th>
                            <th scope="col">Xóa</th>
                        </tr>
                    </thead>
                    <tbody id="cart-body"></tbody>
                </table>
            </div>

            <section class="cart__summary">
                <h2>Tóm tắt đơn hàng</h2>
                <p>Tạm tính <span id="cart-subtotal">0 đ</span></p>
                <p>Giao hàng <span>Miễn phí</span></p>
                <label class="cart__address" for="cart-address">
                    Giao đến
                    <input id="cart-address" type="text" name="address" autocomplete="street-address"
                        placeholder="Nhập địa chỉ nhận hàng" required>
                </label>
                <p class="cart__total">Tổng cộng <strong id="cart-total">0 đ</strong></p>
                <button class="cart__checkout" id="cart-checkout" type="button">Thanh toán</button>
            </section>
        </div>

        <section class="cart__empty" id="cart-empty">
            <h2>Giỏ hàng của bạn đang trống</h2>
            <p>Hãy thêm sản phẩm để tiếp tục mua sắm.</p>
        </section>

        <a class="cart__continue" id="cart-continue" href="./productlist.html">← Tiếp tục mua hàng</a>
        <noscript><p>Vui lòng bật JavaScript để xem và cập nhật giỏ hàng.</p></noscript>
    </main>
    <script src="./assets/js/cart-storage.js"></script>
    <script src="./assets/js/cart.js"></script>
</body>
</html>
